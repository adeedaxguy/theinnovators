<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-productivity">
      <circle cx="200" cy="200" r="188"/>
    </clipPath>
    <linearGradient id="base-productivity" x1="10%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#4FC3E0"/>
      <stop offset="100%" stop-color="#33C17A"/>
    </linearGradient>
    <filter id="blur-soft-productivity" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blur-glow-productivity" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="chip-shadow-productivity" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#33C17A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ambient outer halo -->
  <circle cx="200" cy="200" r="196" fill="#33C17A" opacity="0.16" filter="url(#blur-soft-productivity)"/>

  <g clip-path="url(#clip-productivity)">
    <!-- base diagonal gradient -->
    <rect x="0" y="0" width="400" height="400" fill="url(#base-productivity)"/>

    <!-- soft mesh blobs, mimicking the blurred gradient reference photos -->
    <ellipse cx="120" cy="110" rx="150" ry="130" fill="#B9EAF5" opacity="0.75" filter="url(#blur-soft-productivity)"/>
    <ellipse cx="300" cy="300" rx="150" ry="140" fill="#9EEBC0" opacity="0.55" filter="url(#blur-soft-productivity)"/>
    <ellipse cx="290" cy="90" rx="90" ry="80" fill="#ffffff" opacity="0.20" filter="url(#blur-soft-productivity)"/>

    <!-- gentle bottom vignette for depth -->
    <ellipse cx="200" cy="380" rx="220" ry="120" fill="#000000" opacity="0.10" filter="url(#blur-soft-productivity)"/>

    <!-- glass gloss highlight -->
    <ellipse cx="150" cy="110" rx="120" ry="70" fill="#ffffff" opacity="0.22" filter="url(#blur-glow-productivity)"/>
  </g>

  <!-- thin outer ring -->
  <circle cx="200" cy="200" r="187" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- frosted glass chip -->
  <rect x="128" y="128" width="144" height="144" rx="34" fill="#ffffff" fill-opacity="0.86" filter="url(#chip-shadow-productivity)"/>
  <rect x="128" y="128" width="144" height="144" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- glyph, scaled 0.5 about center, recolored to accent -->
  <g transform="translate(200,200) scale(0.52) translate(-200,-200)"
     fill="none" stroke="#1E9457" color="#1E9457" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    
<rect x="148" y="132" width="104" height="140" rx="16"/>
<rect x="182" y="122" width="36" height="18" rx="7" stroke-width="16"/>
<polyline points="164,178 174,188 194,166" stroke-width="18"/>
<line x1="204" y1="178" x2="236" y2="178" stroke-width="16"/>
<polyline points="164,214 174,224 194,202" stroke-width="18"/>
<line x1="204" y1="214" x2="236" y2="214" stroke-width="16"/>
<polyline points="164,250 174,260 194,238" stroke-width="18"/>
<line x1="204" y1="250" x2="236" y2="250" stroke-width="16"/>

  </g>
</svg>