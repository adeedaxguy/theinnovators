<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-data_intelligence">
      <circle cx="200" cy="200" r="188"/>
    </clipPath>
    <linearGradient id="base-data_intelligence" x1="10%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#5B7CF7"/>
      <stop offset="100%" stop-color="#9B6BF2"/>
    </linearGradient>
    <filter id="blur-soft-data_intelligence" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blur-glow-data_intelligence" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="chip-shadow-data_intelligence" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#9B6BF2" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ambient outer halo -->
  <circle cx="200" cy="200" r="196" fill="#9B6BF2" opacity="0.16" filter="url(#blur-soft-data_intelligence)"/>

  <g clip-path="url(#clip-data_intelligence)">
    <!-- base diagonal gradient -->
    <rect x="0" y="0" width="400" height="400" fill="url(#base-data_intelligence)"/>

    <!-- soft mesh blobs, mimicking the blurred gradient reference photos -->
    <ellipse cx="120" cy="110" rx="150" ry="130" fill="#C1CCFB" opacity="0.75" filter="url(#blur-soft-data_intelligence)"/>
    <ellipse cx="300" cy="300" rx="150" ry="140" fill="#C9AEF7" opacity="0.55" filter="url(#blur-soft-data_intelligence)"/>
    <ellipse cx="290" cy="90" rx="90" ry="80" fill="#ffffff" opacity="0.20" filter="url(#blur-soft-data_intelligence)"/>

    <!-- gentle bottom vignette for depth -->
    <ellipse cx="200" cy="380" rx="220" ry="120" fill="#000000" opacity="0.10" filter="url(#blur-soft-data_intelligence)"/>

    <!-- glass gloss highlight -->
    <ellipse cx="150" cy="110" rx="120" ry="70" fill="#ffffff" opacity="0.22" filter="url(#blur-glow-data_intelligence)"/>
  </g>

  <!-- thin outer ring -->
  <circle cx="200" cy="200" r="187" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- frosted glass chip -->
  <rect x="128" y="128" width="144" height="144" rx="34" fill="#ffffff" fill-opacity="0.86" filter="url(#chip-shadow-data_intelligence)"/>
  <rect x="128" y="128" width="144" height="144" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- glyph, scaled 0.5 about center, recolored to accent -->
  <g transform="translate(200,200) scale(0.52) translate(-200,-200)"
     fill="none" stroke="#5C3FC0" color="#5C3FC0" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    
<circle cx="200" cy="196" r="22"/>
<path d="M148,142 Q170,160 190,182" stroke-width="14"/>
<path d="M252,142 Q230,160 210,182" stroke-width="14"/>
<path d="M132,224 Q168,222 182,206" stroke-width="14"/>
<path d="M268,224 Q232,222 218,206" stroke-width="14"/>
<path d="M200,266 Q200,240 200,218" stroke-width="14"/>
<circle cx="148" cy="142" r="9" stroke="none" fill="currentColor"/>
<circle cx="252" cy="142" r="9" stroke="none" fill="currentColor"/>
<circle cx="132" cy="224" r="9" stroke="none" fill="currentColor"/>
<circle cx="268" cy="224" r="9" stroke="none" fill="currentColor"/>
<circle cx="200" cy="266" r="9" stroke="none" fill="currentColor"/>

  </g>
</svg>