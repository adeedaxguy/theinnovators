<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-learn">
      <circle cx="200" cy="200" r="188"/>
    </clipPath>
    <linearGradient id="base-learn" x1="10%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#F0A93B"/>
    </linearGradient>
    <filter id="blur-soft-learn" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blur-glow-learn" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="chip-shadow-learn" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#F0A93B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ambient outer halo -->
  <circle cx="200" cy="200" r="196" fill="#F0A93B" opacity="0.16" filter="url(#blur-soft-learn)"/>

  <g clip-path="url(#clip-learn)">
    <!-- base diagonal gradient -->
    <rect x="0" y="0" width="400" height="400" fill="url(#base-learn)"/>

    <!-- soft mesh blobs, mimicking the blurred gradient reference photos -->
    <ellipse cx="120" cy="110" rx="150" ry="130" fill="#BEE9FC" opacity="0.75" filter="url(#blur-soft-learn)"/>
    <ellipse cx="300" cy="300" rx="150" ry="140" fill="#F7D488" opacity="0.55" filter="url(#blur-soft-learn)"/>
    <ellipse cx="290" cy="90" rx="90" ry="80" fill="#ffffff" opacity="0.20" filter="url(#blur-soft-learn)"/>

    <!-- gentle bottom vignette for depth -->
    <ellipse cx="200" cy="380" rx="220" ry="120" fill="#000000" opacity="0.10" filter="url(#blur-soft-learn)"/>

    <!-- glass gloss highlight -->
    <ellipse cx="150" cy="110" rx="120" ry="70" fill="#ffffff" opacity="0.22" filter="url(#blur-glow-learn)"/>
  </g>

  <!-- thin outer ring -->
  <circle cx="200" cy="200" r="187" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- frosted glass chip -->
  <rect x="128" y="128" width="144" height="144" rx="34" fill="#ffffff" fill-opacity="0.86" filter="url(#chip-shadow-learn)"/>
  <rect x="128" y="128" width="144" height="144" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- glyph, scaled 0.5 about center, recolored to accent -->
  <g transform="translate(200,200) scale(0.52) translate(-200,-200)"
     fill="none" stroke="#B8860B" color="#B8860B" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    
<path d="M200,158 C168,140 138,142 120,156 L120,246 C138,232 168,230 200,248 Z"/>
<path d="M200,158 C232,140 262,142 280,156 L280,246 C262,232 232,230 200,248 Z"/>
<line x1="200" y1="158" x2="200" y2="248"/>
<g stroke-width="16">
  <line x1="262" y1="112" x2="262" y2="132"/>
  <line x1="252" y1="122" x2="272" y2="122"/>
</g>

  </g>
</svg>