<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-fundraising">
      <circle cx="200" cy="200" r="188"/>
    </clipPath>
    <linearGradient id="base-fundraising" x1="10%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#4FB8F0"/>
      <stop offset="100%" stop-color="#F5C042"/>
    </linearGradient>
    <filter id="blur-soft-fundraising" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blur-glow-fundraising" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="chip-shadow-fundraising" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#F5C042" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ambient outer halo -->
  <circle cx="200" cy="200" r="196" fill="#F5C042" opacity="0.16" filter="url(#blur-soft-fundraising)"/>

  <g clip-path="url(#clip-fundraising)">
    <!-- base diagonal gradient -->
    <rect x="0" y="0" width="400" height="400" fill="url(#base-fundraising)"/>

    <!-- soft mesh blobs, mimicking the blurred gradient reference photos -->
    <ellipse cx="120" cy="110" rx="150" ry="130" fill="#BFE9FC" opacity="0.75" filter="url(#blur-soft-fundraising)"/>
    <ellipse cx="300" cy="300" rx="150" ry="140" fill="#FBE29E" opacity="0.55" filter="url(#blur-soft-fundraising)"/>
    <ellipse cx="290" cy="90" rx="90" ry="80" fill="#ffffff" opacity="0.20" filter="url(#blur-soft-fundraising)"/>

    <!-- gentle bottom vignette for depth -->
    <ellipse cx="200" cy="380" rx="220" ry="120" fill="#000000" opacity="0.10" filter="url(#blur-soft-fundraising)"/>

    <!-- glass gloss highlight -->
    <ellipse cx="150" cy="110" rx="120" ry="70" fill="#ffffff" opacity="0.22" filter="url(#blur-glow-fundraising)"/>
  </g>

  <!-- thin outer ring -->
  <circle cx="200" cy="200" r="187" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- frosted glass chip -->
  <rect x="128" y="128" width="144" height="144" rx="34" fill="#ffffff" fill-opacity="0.86" filter="url(#chip-shadow-fundraising)"/>
  <rect x="128" y="128" width="144" height="144" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- glyph, scaled 0.5 about center, recolored to accent -->
  <g transform="translate(200,200) scale(0.52) translate(-200,-200)"
     fill="none" stroke="#C98E10" color="#C98E10" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    
<path d="M200,120 C218,134 224,168 222,204 L200,226 L178,204 C176,168 182,134 200,120 Z"/>
<circle cx="200" cy="168" r="10" stroke-width="16"/>
<path d="M178,196 C160,196 152,214 150,232 C164,226 176,222 180,210 Z" stroke-width="16"/>
<path d="M222,196 C240,196 248,214 250,232 C236,226 224,222 220,210 Z" stroke-width="16"/>
<path d="M190,226 L200,258 L210,226" stroke-width="16"/>

  </g>
</svg>