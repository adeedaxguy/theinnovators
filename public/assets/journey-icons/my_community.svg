<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-my_community">
      <circle cx="200" cy="200" r="188"/>
    </clipPath>
    <linearGradient id="base-my_community" x1="10%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#4FC3D9"/>
      <stop offset="100%" stop-color="#4FD98C"/>
    </linearGradient>
    <filter id="blur-soft-my_community" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blur-glow-my_community" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="chip-shadow-my_community" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4FD98C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ambient outer halo -->
  <circle cx="200" cy="200" r="196" fill="#4FD98C" opacity="0.16" filter="url(#blur-soft-my_community)"/>

  <g clip-path="url(#clip-my_community)">
    <!-- base diagonal gradient -->
    <rect x="0" y="0" width="400" height="400" fill="url(#base-my_community)"/>

    <!-- soft mesh blobs, mimicking the blurred gradient reference photos -->
    <ellipse cx="120" cy="110" rx="150" ry="130" fill="#BCEDF4" opacity="0.75" filter="url(#blur-soft-my_community)"/>
    <ellipse cx="300" cy="300" rx="150" ry="140" fill="#B0F3CE" opacity="0.55" filter="url(#blur-soft-my_community)"/>
    <ellipse cx="290" cy="90" rx="90" ry="80" fill="#ffffff" opacity="0.20" filter="url(#blur-soft-my_community)"/>

    <!-- gentle bottom vignette for depth -->
    <ellipse cx="200" cy="380" rx="220" ry="120" fill="#000000" opacity="0.10" filter="url(#blur-soft-my_community)"/>

    <!-- glass gloss highlight -->
    <ellipse cx="150" cy="110" rx="120" ry="70" fill="#ffffff" opacity="0.22" filter="url(#blur-glow-my_community)"/>
  </g>

  <!-- thin outer ring -->
  <circle cx="200" cy="200" r="187" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- frosted glass chip -->
  <rect x="128" y="128" width="144" height="144" rx="34" fill="#ffffff" fill-opacity="0.86" filter="url(#chip-shadow-my_community)"/>
  <rect x="128" y="128" width="144" height="144" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- glyph, scaled 0.5 about center, recolored to accent -->
  <g transform="translate(200,200) scale(0.52) translate(-200,-200)"
     fill="none" stroke="#1F9E5C" color="#1F9E5C" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    
<circle cx="200" cy="164" r="20"/>
<circle cx="146" cy="238" r="16" stroke-width="18"/>
<circle cx="254" cy="238" r="16" stroke-width="18"/>
<circle cx="200" cy="256" r="14" stroke-width="18"/>
<line x1="200" y1="184" x2="200" y2="242" stroke-width="14"/>
<line x1="186" y1="176" x2="156" y2="224" stroke-width="14"/>
<line x1="214" y1="176" x2="244" y2="224" stroke-width="14"/>

  </g>
</svg>