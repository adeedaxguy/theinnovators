<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-build">
      <circle cx="200" cy="200" r="188"/>
    </clipPath>
    <linearGradient id="base-build" x1="10%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#4F8CF7"/>
      <stop offset="100%" stop-color="#F2665A"/>
    </linearGradient>
    <filter id="blur-soft-build" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blur-glow-build" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="chip-shadow-build" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#F2665A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ambient outer halo -->
  <circle cx="200" cy="200" r="196" fill="#F2665A" opacity="0.16" filter="url(#blur-soft-build)"/>

  <g clip-path="url(#clip-build)">
    <!-- base diagonal gradient -->
    <rect x="0" y="0" width="400" height="400" fill="url(#base-build)"/>

    <!-- soft mesh blobs, mimicking the blurred gradient reference photos -->
    <ellipse cx="120" cy="110" rx="150" ry="130" fill="#B7D0FB" opacity="0.75" filter="url(#blur-soft-build)"/>
    <ellipse cx="300" cy="300" rx="150" ry="140" fill="#F7A99F" opacity="0.55" filter="url(#blur-soft-build)"/>
    <ellipse cx="290" cy="90" rx="90" ry="80" fill="#ffffff" opacity="0.20" filter="url(#blur-soft-build)"/>

    <!-- gentle bottom vignette for depth -->
    <ellipse cx="200" cy="380" rx="220" ry="120" fill="#000000" opacity="0.10" filter="url(#blur-soft-build)"/>

    <!-- glass gloss highlight -->
    <ellipse cx="150" cy="110" rx="120" ry="70" fill="#ffffff" opacity="0.22" filter="url(#blur-glow-build)"/>
  </g>

  <!-- thin outer ring -->
  <circle cx="200" cy="200" r="187" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- frosted glass chip -->
  <rect x="128" y="128" width="144" height="144" rx="34" fill="#ffffff" fill-opacity="0.86" filter="url(#chip-shadow-build)"/>
  <rect x="128" y="128" width="144" height="144" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- glyph, scaled 0.5 about center, recolored to accent -->
  <g transform="translate(200,200) scale(0.52) translate(-200,-200)"
     fill="none" stroke="#C43D30" color="#C43D30" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    
<rect x="138" y="196" width="34" height="80" rx="4"/>
<rect x="183" y="150" width="34" height="126" rx="4"/>
<rect x="228" y="176" width="34" height="100" rx="4"/>
<line x1="200" y1="150" x2="200" y2="106"/>
<line x1="200" y1="106" x2="256" y2="106"/>
<line x1="176" y1="130" x2="200" y2="106"/>
<line x1="248" y1="106" x2="248" y2="126" stroke-width="14"/>

  </g>
</svg>