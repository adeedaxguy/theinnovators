<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip-sales">
      <circle cx="200" cy="200" r="188"/>
    </clipPath>
    <linearGradient id="base-sales" x1="10%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#4F9FF7"/>
      <stop offset="100%" stop-color="#F2B84A"/>
    </linearGradient>
    <filter id="blur-soft-sales" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blur-glow-sales" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="chip-shadow-sales" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#F2B84A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ambient outer halo -->
  <circle cx="200" cy="200" r="196" fill="#F2B84A" opacity="0.16" filter="url(#blur-soft-sales)"/>

  <g clip-path="url(#clip-sales)">
    <!-- base diagonal gradient -->
    <rect x="0" y="0" width="400" height="400" fill="url(#base-sales)"/>

    <!-- soft mesh blobs, mimicking the blurred gradient reference photos -->
    <ellipse cx="120" cy="110" rx="150" ry="130" fill="#BAD6FB" opacity="0.75" filter="url(#blur-soft-sales)"/>
    <ellipse cx="300" cy="300" rx="150" ry="140" fill="#FBDDA0" opacity="0.55" filter="url(#blur-soft-sales)"/>
    <ellipse cx="290" cy="90" rx="90" ry="80" fill="#ffffff" opacity="0.20" filter="url(#blur-soft-sales)"/>

    <!-- gentle bottom vignette for depth -->
    <ellipse cx="200" cy="380" rx="220" ry="120" fill="#000000" opacity="0.10" filter="url(#blur-soft-sales)"/>

    <!-- glass gloss highlight -->
    <ellipse cx="150" cy="110" rx="120" ry="70" fill="#ffffff" opacity="0.22" filter="url(#blur-glow-sales)"/>
  </g>

  <!-- thin outer ring -->
  <circle cx="200" cy="200" r="187" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- frosted glass chip -->
  <rect x="128" y="128" width="144" height="144" rx="34" fill="#ffffff" fill-opacity="0.86" filter="url(#chip-shadow-sales)"/>
  <rect x="128" y="128" width="144" height="144" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- glyph, scaled 0.5 about center, recolored to accent -->
  <g transform="translate(200,200) scale(0.52) translate(-200,-200)"
     fill="none" stroke="#C97C11" color="#C97C11" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    
<line x1="132" y1="228" x2="182" y2="192" stroke-width="30"/>
<line x1="268" y1="228" x2="218" y2="192" stroke-width="30"/>
<circle cx="200" cy="192" r="16" stroke-width="16"/>
<path d="M170,150 L190,150 L200,168 L180,168 Z" stroke-width="16"/>
<line x1="215" y1="146" x2="215" y2="164" stroke-width="16"/>
<line x1="207" y1="155" x2="223" y2="155" stroke-width="16"/>

  </g>
</svg>